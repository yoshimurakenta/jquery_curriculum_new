<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
    // 回答はここに書いてね
    $(function() {
      $('.wrapper').on('click', '#pokemon_search', function() {
        let randomId = Math.floor(Math.random() * 151) + 1;
        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon/${randomId}`,
          method: 'GET'
        }).done(function(res) {
          console.log(res.species.url);
          console.log(res.sprites.front_default);
          $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon-species/${randomId}/`,
          method: 'GET'
        }).done(function(speciesRes) {
          let japaneseName = speciesRes.names.find(name => name.language.name === 'ja').name;
          let encountHtml = `
            <p class="name">${japaneseName}</p>
            <div>
              <img class="img" src="${res.sprites.front_default}" alt="${japaneseName}">
            </div>
            <div>
              <button class="btn" id="catch">捕まえる</button>
            <button class="btn" data-js="reset">逃げる</button>
            </div>
          `;
          $('.wrapper').html(encountHtml);
        }).fail(function(err) {
          console.error('詳細データの取得失敗', err);
        });
        }).fail(function(err) {
          console.error('ポケモンの情報取得失敗', err);
        });
      });

      $('.wrapper').on('click', '#catch', function(){
        if (Math.random() < 0.5) {
          $.ajax({
            url: 'https://pokeapi.co/api/v2/item/4',
            method: 'GET'
          }).done(function(itemRes) {
            let doneHtml =
              `
                <p class="name">ゲットしました</p>
                <div>
                  <img class="img" src="${itemRes.sprites.default}" alt="モンスターボール">
                </div>
                <button class="btn" data-js="reset">戻る</button>
              `
              $('.wrapper').html(doneHtml);
          }).fail(function(err) {
            console.error('モンスターボール取得失敗', err);
        });
        } else {
          let failHtml =
              `
                <p class="text">逃げられてしまった...</p>
                <button class="btn mt" data-js="reset">戻る</button>
              `
              $('.wrapper').html(failHtml);
        }
      });

      $('.wrapper').on('click', '[data-js="reset"]', function() {
        let resetHtml =
        `
          <button id="pokemon_search" class="btn search-btn">ポケモンを探す</button>
        `;
        $('.wrapper').html(resetHtml);
      });
  });
  </script>
</body>
</html>
